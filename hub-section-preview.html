<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub recreation preview</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;color:#fff}
  .wrap{max-width:1200px;margin:0 auto;padding:clamp(40px,6vw,80px) 20px}
  .diagram{position:relative;display:grid;grid-template-columns:minmax(210px,320px) 1fr minmax(210px,320px);
    column-gap:clamp(16px,5vw,80px);align-items:center;min-height:520px}
  .wires{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:visible}
  .trace{fill:none;stroke:rgba(120,225,255,0.9);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 3px rgba(0,198,255,0.9))}
  .pad{fill:#9fecff;filter:drop-shadow(0 0 3px rgba(0,198,255,1))}
  .ringmain{fill:none;stroke:rgba(90,215,255,0.95);stroke-width:2.4;filter:drop-shadow(0 0 8px rgba(0,198,255,0.7))}
  .ringinner{fill:none;stroke:rgba(90,215,255,0.4);stroke-width:1.2}
  .ringdash{fill:none;stroke:rgba(90,215,255,0.35);stroke-width:1.2;stroke-dasharray:3 7}
  .disc{fill:#02090f}
  .col{grid-row:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(16px,2.6vw,30px);min-width:0}
  .col.left{grid-column:1}.col.right{grid-column:3}
  .hub{grid-column:2;grid-row:1;position:relative;z-index:2;display:flex;align-items:center;justify-content:center;min-height:360px}
  .hub img{width:clamp(120px,15vw,190px);height:auto;filter:drop-shadow(0 0 18px rgba(0,198,255,0.55))}
  .box{position:relative;z-index:1;display:flex;align-items:center;gap:15px;padding:15px 18px;border-radius:18px;min-width:0;
    background:rgba(255,255,255,0.015);border:1px solid rgba(255,255,255,0.14)}
  .box .nm{font-weight:600;font-size:clamp(14px,1.5vw,19px);color:#f2f5f8;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ic{width:52px;height:52px;border-radius:14px;flex:0 0 auto;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,0.5)}
  .ic svg{width:29px;height:29px;display:block}
  .b-ig{border-color:rgba(214,41,118,0.4)}.b-wa{border-color:rgba(37,211,102,0.4)}
  .b-sms{border-color:rgba(0,198,255,0.4)}.b-fb{border-color:rgba(24,119,242,0.4)}
  .b-web{border-color:rgba(14,107,133,0.5)}.b-goog{border-color:rgba(234,179,8,0.35)}
  .b-em{border-color:rgba(138,148,166,0.4)}.b-phone{border-color:rgba(30,167,253,0.4)}
  .ig-bg{background:linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
  .wa-bg{background:#25d366}.sms-bg{background:#1ea7fd}.fb-bg{background:#1877f2}
  .web-bg{background:#0e5a6e}.goog-bg{background:#fff}.em-bg{background:#8a94a6}.phone-bg{background:#1ea7fd}
  /* mobile: two real columns with the logo on top, joined by circuit lines */
  @media (max-width:860px){
    .diagram{grid-template-columns:1fr 1fr;grid-template-rows:auto auto;column-gap:clamp(34px,11vw,90px);row-gap:24px;min-height:0;align-items:start}
    .hub{grid-column:1/-1;grid-row:1;min-height:0;margin-bottom:16px}
    .hub img{width:116px}
    .col{grid-row:2;gap:24px}.col.left{grid-column:1}.col.right{grid-column:2}
    .box{padding:12px 14px;gap:12px}
    .ic{width:46px;height:46px}.ic svg{width:25px;height:25px}
    .box .nm{font-size:14.5px}
  }
  @media (max-width:400px){.box{padding:11px 12px;gap:10px}.ic{width:42px;height:42px}}
</style></head>

<script>
const NS="http://www.w3.org/2000/svg";
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function poly(svg,pts){svg.appendChild(el('polyline',{class:'trace',points:pts.map(p=>p[0]+','+p[1]).join(' ')}));}
function pad(svg,x,y,r){svg.appendChild(el('circle',{class:'pad',cx:x,cy:y,r:r||3.6}));}
function rel(b,g){const r=b.getBoundingClientRect();return{l:r.left-g.left,r:r.right-g.left,t:r.top-g.top,b:r.bottom-g.top,cx:(r.left+r.right)/2-g.left,cy:(r.top+r.bottom)/2-g.top};}
function drawDesktop(svg,d,g){
  const lr=d.querySelector('.hub img').getBoundingClientRect();
  const C={x:lr.left+lr.width/2-g.left,y:lr.top+lr.height/2-g.top}; const R=lr.width*0.95;
  svg.appendChild(el('circle',{class:'disc',cx:C.x,cy:C.y,r:R*0.98}));
  svg.appendChild(el('circle',{class:'ringdash',cx:C.x,cy:C.y,r:R*1.2}));
  svg.appendChild(el('circle',{class:'ringinner',cx:C.x,cy:C.y,r:R*0.82}));
  svg.appendChild(el('circle',{class:'ringmain',cx:C.x,cy:C.y,r:R}));
  d.querySelectorAll('.box').forEach(box=>{
    const side=box.dataset.side, b=rel(box,g), sign=side==='l'?-1:1;
    const ay=Math.max(C.y-R*0.8,Math.min(b.cy,C.y+R*0.8));
    const ax=C.x+sign*Math.sqrt(Math.max(0,R*R-(ay-C.y)*(ay-C.y)));
    const bx=side==='l'?b.r:b.l, lane=C.x+sign*(R+26);
    poly(svg,[[bx,b.cy],[lane,b.cy],[lane,ay],[ax,ay]]);
    pad(svg,bx,b.cy,4); pad(svg,ax,ay,3.4);
  });
}
function drawMobile(svg,d,g){
  const lr=d.querySelector('.hub img').getBoundingClientRect();
  const Cx=lr.left+lr.width/2-g.left, hubB=lr.bottom-g.top;
  const cols=[[...d.querySelectorAll('.col.left .box')],[...d.querySelectorAll('.col.right .box')]]
    .map(a=>a.map(b=>rel(b,g)).sort((x,y)=>x.t-y.t));
  if(!cols[0].length||!cols[1].length) return;
  const L=cols[0], Rr=cols[1];
  const branchY=(hubB+Math.min(L[0].t,Rr[0].t))/2;
  poly(svg,[[Cx,hubB],[Cx,branchY]]);                 // stem down from logo
  poly(svg,[[L[0].cx,branchY],[Rr[0].cx,branchY]]);   // horizontal bar
  poly(svg,[[L[0].cx,branchY],[L[0].cx,L[0].t]]);     // drop into left top
  poly(svg,[[Rr[0].cx,branchY],[Rr[0].cx,Rr[0].t]]);  // drop into right top
  pad(svg,Cx,hubB,4); pad(svg,L[0].cx,L[0].t); pad(svg,Rr[0].cx,Rr[0].t);
  cols.forEach(col=>{for(let i=1;i<col.length;i++){
    poly(svg,[[col[i].cx,col[i].t],[col[i].cx,col[i-1].b]]);
    pad(svg,col[i].cx,col[i].t); pad(svg,col[i].cx,col[i-1].b);
  }});
}
function draw(){
  const d=document.getElementById('diagram'), svg=document.getElementById('wires');
  const g=d.getBoundingClientRect(); svg.setAttribute('viewBox',`0 0 ${g.width} ${g.height}`); svg.innerHTML='';
  if(window.matchMedia('(max-width:860px)').matches) drawMobile(svg,d,g); else drawDesktop(svg,d,g);
}
new ResizeObserver(draw).observe(document.getElementById('diagram'));
addEventListener('load',draw); addEventListener('resize',draw); draw();
</script>
