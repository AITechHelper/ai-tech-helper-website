<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cloud Background Preview — AI Tech Helper</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#000; overflow-x:hidden; }
  .hero{ position:relative; height:100vh; overflow:hidden; }
  #gl{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* fade the bottom of the hero to black so it blends into the page below */
  .fade{ position:absolute; left:0; right:0; bottom:0; height:82%;
         background:linear-gradient(to bottom,
           rgba(0,0,0,0) 0%,
           rgba(0,0,0,0.04) 12%,
           rgba(0,0,0,0.10) 24%,
           rgba(0,0,0,0.18) 36%,
           rgba(0,0,0,0.28) 48%,
           rgba(0,0,0,0.40) 60%,
           rgba(0,0,0,0.55) 72%,
           rgba(0,0,0,0.72) 84%,
           rgba(0,0,0,0.90) 93%,
           #000 100%);
         z-index:1; pointer-events:none; }
  .content{
    position:relative; z-index:2; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:#fff; padding:24px; text-shadow:0 2px 34px rgba(0,30,45,.35); pointer-events:none;
  }
  .content h1{ font-size:clamp(40px,9vw,110px); font-weight:700; letter-spacing:-.02em }
  .content p{ font-size:clamp(16px,2.4vw,22px); margin-top:14px; opacity:.94 }
  .btn{ margin-top:28px; padding:14px 30px; border-radius:999px; background:#fff; color:#0a5f86; font-weight:600; font-size:16px; border:none; pointer-events:auto; cursor:pointer; }
  /* the black page after the hero */
  .after{ background:#000; color:#e7ebf2; min-height:100vh; padding:80px 24px;
          display:flex; flex-direction:column; align-items:center; text-align:center; }
  .after h2{ font-size:clamp(24px,4vw,40px); font-weight:700; }
  .after p{ margin-top:14px; max-width:560px; color:#aab3bf; }
  .hint{ position:fixed; bottom:16px; left:0; right:0; text-align:center; color:rgba(255,255,255,.72); font-size:13px; z-index:3; }
</style>
</head>
<body>
  <section class="hero">
    <canvas id="gl"></canvas>
    <div class="fade"></div>
    <div class="content">
      <h1>AI Tech Helper</h1>
      <p>The same powerful AI—working for your business.</p>
      <button class="btn">Get started</button>
    </div>
  </section>
  <section class="after">
    <h2>The page continues in black</h2>
    <p>Scroll up and down — the hero clouds fade into this black section with no seam.</p>
  </section>
  <div class="hint">Preview — hero fades to black. Scroll to see the handoff.</div>

<script>
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl');

const vert = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.0,1.0); }`;

// Soft mesh-gradient: a few big color points that drift slowly and blend smoothly.
const frag = `
precision highp float;
uniform vec2  u_res;
uniform float u_time;

// smooth influence falloff
float infl(vec2 uv, vec2 c, float r){
  float d = distance(uv, c);
  return exp(-(d*d)/(2.0*r*r));   // gaussian -> very soft, no hard edges
}

// inverse-distance weight (how a mesh-gradient tool interpolates its points)
float idw(vec2 uv, vec2 p){
  float d = distance(uv, p);
  return 1.0 / (pow(d, 3.5) + 0.0009);
}

void main(){
  vec2 uv = gl_FragCoord.xy / u_res.xy;   // 0..1, y up (no aspect scaling -> keeps composition)

  float t  = u_time;
  float mw = 0.045;                        // white drift amount (moves faster)
  float mc = 0.022;                        // cyan drift amount (slower)

  vec3 cyan  = vec3(0.204,0.792,0.965);    // #34caf6  soft sky cyan (as in image)
  vec3 white = vec3(1.0);

  // Control points read straight off your reference grid.
  // white points (spread across corners + middle), faster motion:
  vec2 W1 = vec2(0.88 + mw*sin(t*0.90),        0.90 + mw*sin(t*1.10+1.0)); // top-right
  vec2 W2 = vec2(0.21 + mw*sin(t*1.05+2.0),    0.45 + mw*sin(t*0.95+2.0)); // mid-left
  vec2 W3 = vec2(0.88 + mw*sin(t*0.95+3.0),    0.31 + mw*sin(t*1.10+3.0)); // right-mid
  vec2 W4 = vec2(0.09 + mw*sin(t*1.10+4.0),    0.13 + mw*sin(t*0.90+4.0)); // bottom-left
  vec2 W5 = vec2(0.21 + mw*sin(t*0.95+5.0),    0.21 + mw*sin(t*1.05+5.0)); // lower-left

  // cyan points tracing the S (top-left down to bottom-right), slower motion:
  vec2 C1 = vec2(0.05 + mc*sin(t*0.55),        0.90 + mc*sin(t*0.65+1.0)); // top-left
  vec2 C2 = vec2(0.10 + mc*sin(t*0.60+2.0),    0.76 + mc*sin(t*0.50+2.0)); // upper-left
  vec2 C3 = vec2(0.46 + mc*sin(t*0.50+3.0),    0.69 + mc*sin(t*0.60+3.0)); // upper-center
  vec2 C4 = vec2(0.67 + mc*sin(t*0.55+4.0),    0.31 + mc*sin(t*0.50+4.0)); // lower-center
  vec2 C5 = vec2(0.83 + mc*sin(t*0.60+5.0),    0.13 + mc*sin(t*0.55+5.0)); // bottom-right

  vec3 deep = vec3(0.047,0.498,0.690);     // #0c7fb0  deeper teal-blue

  // weighted average of all points' colors (3-color mesh: white / cyan / deep)
  // white points get reduced weight so blue reads more than white in the hero
  float ww = 0.62;
  vec3 num = vec3(0.0); float den = 0.0, w;
  w = idw(uv,W1)*ww; num += w*white; den += w;
  w = idw(uv,W2)*ww; num += w*white; den += w;
  w = idw(uv,W3)*ww; num += w*white; den += w;
  w = idw(uv,W4)*ww; num += w*white; den += w;
  w = idw(uv,W5)*ww; num += w*white; den += w;
  w = idw(uv,C1); num += w*cyan;  den += w;
  w = idw(uv,C2); num += w*cyan;  den += w;
  w = idw(uv,C3); num += w*cyan;  den += w;
  w = idw(uv,C4); num += w*deep;  den += w;   // lower-center -> deep blue
  w = idw(uv,C5); num += w*deep;  den += w;   // bottom-right -> deep blue

  vec3 col = num / max(den, 0.0001);

  gl_FragColor = vec4(col,1.0);
}
`;

function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vert));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
gl.linkProgram(prog); gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const uRes  = gl.getUniformLocation(prog, 'u_res');
const uTime = gl.getUniformLocation(prog, 'u_time');

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width  = innerWidth*dpr; canvas.height = innerHeight*dpr;
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener('resize', resize); resize();

const start = performance.now();
function loop(){
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, (performance.now()-start)/1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
